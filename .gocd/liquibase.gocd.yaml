# GoCD pipeline-as-code — requires the GoCD YAML Config Plugin
# https://github.com/tomzo/gocd-yaml-config-plugin
#
# Setup checklist:
#   1. Install "YAML Configuration Plugin" from GoCD plugin marketplace
#   2. Admin → Config Repositories → Add → point to this Git repo, pattern: .gocd/*.gocd.yaml
#      Rules tab → Allow / refer / Pipeline Group / liquibase
#   3. Encrypt DB password:
#        GoCD Admin → Encryption → paste the password → copy the AES:xxx:yyy string
#        Replace the AES:REPLACE_ME placeholder in secure_variables below
#        DB_USERNAME is a plain environment_variable (not sensitive)
#   4. Set CI_CONTAINER to the exact name of your GoCD agent Docker container
#        (run `docker ps` to confirm the name)
#   5. Ensure the GoCD agent container has Docker socket mounted:
#        -v /var/run/docker.sock:/var/run/docker.sock
#
# Three separate pipelines mirror the three Jenkins ACTIONs:
#   liquibase-dry-run   — validate + preview SQL, archives liquibase-dry-run.sql
#   liquibase-migrate   — validate + show pending + apply + auto-tag build-<counter>
#   liquibase-rollback  — validate + params check + preview SQL + manual gate + execute

format_version: 10

pipelines:

  # ─────────────────────────────────────────────────────────────
  # DRY RUN — safe to trigger anytime; no DB writes
  # ─────────────────────────────────────────────────────────────
  liquibase-dry-run:
    group: liquibase
    label_template: ${git[:8]}
    lock_behavior: none
    environment_variables:
      CI_CONTAINER: gocd-agent        # change to your agent container name
      DB_USERNAME: amit
    secure_variables:
      DB_PASSWORD: "AES:GVcPThKyI51nLONSeFyotg==:j1mVWa02UYNAJZV74h0R4Q=="   # GoCD Admin → Encryption → encrypt your DB password
    materials:
      git:
        git: https://github.com/toamitrawat/liquibase-migrations.git
        branch: main
        shallow_clone: true
        auto_update: false
    stages:
      - validate:
          jobs:
            validate:
              tasks:
                - exec:
                    command: make
                    arguments: [validate]

      - dry-run:
          jobs:
            dry-run:
              artifacts:
                - build:
                    source: liquibase-dry-run.sql
                    destination: ""
              tasks:
                - exec:
                    command: make
                    arguments: [dry-run]

  # ─────────────────────────────────────────────────────────────
  # MIGRATE — applies pending changesets and stamps a release tag
  # ─────────────────────────────────────────────────────────────
  liquibase-migrate:
    group: liquibase
    label_template: ${git[:8]}
    lock_behavior: lockOnFailure      # prevent concurrent migrations
    environment_variables:
      CI_CONTAINER: gocd-agent        # change to your agent container name
      DB_USERNAME: amit
    secure_variables:
      DB_PASSWORD: "AES:GVcPThKyI51nLONSeFyotg==:j1mVWa02UYNAJZV74h0R4Q=="
    materials:
      git:
        git: https://github.com/toamitrawat/liquibase-migrations.git
        branch: main
        shallow_clone: true
        auto_update: false
    stages:
      - validate:
          jobs:
            validate:
              tasks:
                - exec:
                    command: make
                    arguments: [validate]

      - pending-changes:
          jobs:
            status:
              tasks:
                - exec:
                    command: make
                    arguments: [status]

      - migrate:
          jobs:
            migrate:
              tasks:
                - exec:
                    command: make
                    arguments: [migrate]
                # Auto-tag with build-<pipeline counter> after successful migration
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - RELEASE_TAG=build-${GO_PIPELINE_COUNTER} make tag

  # ─────────────────────────────────────────────────────────────
  # ROLLBACK — preview SQL, manual approval gate, then execute
  #
  # Usage: trigger this pipeline and set ROLLBACK_TO_TAG to the
  # target tag (e.g. build-5). You can override environment
  # variables at trigger time in the GoCD "Trigger with Options" dialog.
  # ─────────────────────────────────────────────────────────────
  liquibase-rollback:
    group: liquibase
    label_template: ${git[:8]}
    lock_behavior: lockOnFailure
    environment_variables:
      CI_CONTAINER: gocd-agent        # change to your agent container name
      DB_USERNAME: amit
      ROLLBACK_TO_TAG: ""             # override at trigger time via "Trigger with Options"
    secure_variables:
      DB_PASSWORD: "AES:GVcPThKyI51nLONSeFyotg==:j1mVWa02UYNAJZV74h0R4Q=="
    materials:
      git:
        git: https://github.com/toamitrawat/liquibase-migrations.git
        branch: main
        shallow_clone: true
        auto_update: false
    stages:
      - validate:
          jobs:
            validate:
              tasks:
                - exec:
                    command: make
                    arguments: [validate]

      - validate-parameters:
          jobs:
            check-tag:
              tasks:
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - |
                        if [ -z "${ROLLBACK_TO_TAG}" ]; then
                          echo "ERROR: ROLLBACK_TO_TAG must be set. Example: build-5"
                          exit 1
                        fi
                        echo "Rolling back to tag: ${ROLLBACK_TO_TAG}"

      - rollback-dry-run:
          jobs:
            preview:
              tasks:
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - RELEASE_TAG=${ROLLBACK_TO_TAG} make rollback-dry-run

      # Manual approval gate — pipeline pauses here until approved in GoCD UI
      - rollback:
          approval:
            type: manual
            allow_only_on_success: true
          jobs:
            execute:
              tasks:
                - exec:
                    command: sh
                    arguments:
                      - -c
                      - RELEASE_TAG=${ROLLBACK_TO_TAG} make rollback
